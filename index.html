<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070b14">
<title>Snake · Neon</title>
<style>
  :root {
    --bg: #070b14;
    --card: rgba(255, 255, 255, 0.055);
    --stroke: rgba(255, 255, 255, 0.1);
    --text: #e8ecf4;
    --muted: #8b93a7;
    --accent: #a3e635;
    --accent2: #34d399;
    --danger: #f87171;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px 0;
    color: var(--text);
    font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(900px 600px at 15% -10%, rgba(52, 211, 153, 0.14), transparent 60%),
      radial-gradient(900px 700px at 110% 110%, rgba(59, 130, 246, 0.16), transparent 60%),
      radial-gradient(700px 500px at 50% 120%, rgba(163, 230, 53, 0.08), transparent 60%),
      var(--bg);
    overflow-x: hidden;
  }
  .shell { width: min(94vw, 560px); }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    background: var(--card);
    border: 1px solid var(--stroke);
    border-radius: 18px;
    backdrop-filter: blur(10px);
  }
  .brand {
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 0.06em;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  .brand .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px 2px rgba(163, 230, 53, 0.8);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.7); opacity: 0.6; } }
  .hud { display: flex; gap: 18px; }
  .stat { text-align: center; min-width: 52px; }
  .stat .label {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .stat .value {
    font-size: 20px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .stat .value.score { color: var(--accent); text-shadow: 0 0 16px rgba(163, 230, 53, 0.5); }
  .icon-btns { display: flex; gap: 8px; }
  .icon-btn {
    width: 38px; height: 38px;
    display: grid; place-items: center;
    font-size: 16px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--stroke);
    border-radius: 12px;
    color: var(--text);
    cursor: pointer;
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.12); transform: translateY(-1px); }
  .icon-btn:active { transform: translateY(0); }

  /* ---------- Board ---------- */
  .board-wrap {
    position: relative;
    margin-top: 14px;
    aspect-ratio: 1;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid var(--stroke);
    box-shadow:
      0 24px 70px rgba(0, 0, 0, 0.55),
      0 0 40px rgba(52, 211, 153, 0.06),
      inset 0 0 0 1px rgba(255, 255, 255, 0.03);
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; }

  /* ---------- Overlay ---------- */
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 24px;
    text-align: center;
    background: rgba(6, 9, 17, 0.72);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    cursor: pointer;
    transition: opacity 0.22s ease;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  .ov-emoji { font-size: 44px; line-height: 1; filter: drop-shadow(0 0 18px rgba(163,230,53,0.4)); }
  .ov-title {
    margin: 0;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .ov-title.danger { color: var(--danger); text-shadow: 0 0 24px rgba(248,113,113,0.5); }
  .ov-score {
    font-size: 52px;
    font-weight: 800;
    color: var(--accent);
    text-shadow: 0 0 30px rgba(163, 230, 53, 0.55);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .ov-sub { margin: 0; color: var(--muted); font-size: 14px; }
  .badge {
    margin-top: 4px;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    background: linear-gradient(90deg, rgba(250, 204, 21, 0.18), rgba(250, 204, 21, 0.08));
    border: 1px solid rgba(250, 204, 21, 0.4);
    color: #fde047;
  }
  .btn {
    margin-top: 8px;
    padding: 13px 34px;
    border: none;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: #08130b;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 8px 28px rgba(52, 211, 153, 0.35);
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 34px rgba(52, 211, 153, 0.45); }
  .btn:active { transform: translateY(0); }
  .ov-hint { margin: 0; font-size: 12px; color: var(--muted); }
  kbd {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--stroke);
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 1px 5px;
  }

  /* ---------- Persistent stats ---------- */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-top: 14px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--stroke);
    border-radius: 14px;
    padding: 10px 6px;
    text-align: center;
    backdrop-filter: blur(8px);
  }
  .card .label {
    display: block;
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 3px;
  }
  .card .value {
    font-size: 16px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .card .value.hl { color: #fde047; text-shadow: 0 0 14px rgba(250, 204, 21, 0.4); }

  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 14px;
    padding: 0 4px;
    color: var(--muted);
    font-size: 12px;
  }
  .footer .hints { display: flex; gap: 12px; flex-wrap: wrap; }
  .reset-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline dotted;
    padding: 2px 0;
  }
  .reset-btn:hover { color: var(--danger); }

  /* ---------- D-pad (touch) ---------- */
  .dpad {
    display: none;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 54px);
    gap: 8px;
    margin-top: 14px;
  }
  .dpad button {
    font-size: 18px;
    background: var(--card);
    border: 1px solid var(--stroke);
    border-radius: 14px;
    color: var(--text);
    cursor: pointer;
    touch-action: none;
    user-select: none;
  }
  .dpad button:active { background: rgba(163, 230, 53, 0.2); }
  .dpad-up { grid-column: 2; grid-row: 1; }
  .dpad-left { grid-column: 1; grid-row: 2; }
  .dpad-down { grid-column: 2; grid-row: 2; }
  .dpad-right { grid-column: 3; grid-row: 2; }
  @media (pointer: coarse) { .dpad { display: grid; } .footer .hints { display: none; } }

  @media (max-width: 440px) {
    .stats-grid { grid-template-columns: repeat(3, 1fr); }
    .hud { gap: 10px; }
    .stat .value { font-size: 17px; }
    .ov-title { font-size: 24px; }
    .ov-score { font-size: 42px; }
  }
</style>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div class="brand"><span class="dot"></span>SNAKE</div>
    <div class="hud">
      <div class="stat"><span class="label">Score</span><span class="value score" id="hudScore">0</span></div>
      <div class="stat"><span class="label">Best</span><span class="value" id="hudBest">0</span></div>
      <div class="stat"><span class="label">Level</span><span class="value" id="hudLevel">1</span></div>
    </div>
    <div class="icon-btns">
      <button class="icon-btn" id="btnMute" title="Mute (M)" aria-label="Mute">🔊</button>
      <button class="icon-btn" id="btnPause" title="Pause (Space)" aria-label="Pause">⏸</button>
    </div>
  </header>

  <div class="board-wrap" id="boardWrap">
    <canvas id="game"></canvas>
    <div id="overlay"></div>
  </div>

  <div class="dpad" id="dpad" aria-label="Direction pad">
    <button class="dpad-up" data-dx="0" data-dy="-1" aria-label="Up">▲</button>
    <button class="dpad-left" data-dx="-1" data-dy="0" aria-label="Left">◀</button>
    <button class="dpad-down" data-dx="0" data-dy="1" aria-label="Down">▼</button>
    <button class="dpad-right" data-dx="1" data-dy="0" aria-label="Right">▶</button>
  </div>

  <section class="stats-grid" aria-label="Persistent statistics">
    <div class="card"><span class="label">Best score</span><span class="value hl" id="statBest">0</span></div>
    <div class="card"><span class="label">Games</span><span class="value" id="statGames">0</span></div>
    <div class="card"><span class="label">Apples</span><span class="value" id="statApples">0</span></div>
    <div class="card"><span class="label">Longest</span><span class="value" id="statLongest">0</span></div>
    <div class="card"><span class="label">Play time</span><span class="value" id="statTime">0s</span></div>
  </section>

  <footer class="footer">
    <div class="hints">
      <span><kbd>↑↓←→</kbd> / <kbd>WASD</kbd> move</span>
      <span><kbd>Space</kbd> pause</span>
      <span><kbd>M</kbd> mute</span>
    </div>
    <button class="reset-btn" id="btnReset">reset stats</button>
  </footer>
</main>

<script>
(() => {
'use strict';

/* ================= Persistence ================= */
const STORAGE_KEY = 'snake.stats.v1';
const MUTE_KEY = 'snake.muted.v1';

const defaultStats = () => ({
  highScore: 0,
  gamesPlayed: 0,
  totalApples: 0,
  longestSnake: 0,
  totalPlayTimeMs: 0,
  lastPlayedAt: null,
});

function loadStats() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return Object.assign(defaultStats(), JSON.parse(raw));
  } catch (e) { /* private mode etc. */ }
  return defaultStats();
}
function saveStats() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(stats)); } catch (e) {}
}

let stats = loadStats();
let muted;
try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch (e) { muted = false; }

/* ================= Audio (Web Audio API) ================= */
let audioCtx = null;
function actx() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone({ freq = 440, type = 'sine', dur = 0.15, vol = 0.2, slide = 0, delay = 0 }) {
  if (muted) return;
  const ac = actx();
  if (!ac) return;
  const t0 = ac.currentTime + delay;
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(1, freq + slide), t0 + dur);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain).connect(ac.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.05);
}
const sfx = {
  eat() {
    tone({ freq: 520, slide: 280, type: 'sine', dur: 0.12, vol: 0.24 });
    tone({ freq: 780, slide: 260, type: 'sine', dur: 0.10, vol: 0.16, delay: 0.05 });
  },
  die() {
    tone({ freq: 320, slide: -260, type: 'sawtooth', dur: 0.45, vol: 0.2 });
    tone({ freq: 150, slide: -90, type: 'triangle', dur: 0.6, vol: 0.18, delay: 0.06 });
  },
  level() { [440, 554, 659].forEach((f, i) => tone({ freq: f, type: 'sine', dur: 0.16, vol: 0.14, delay: i * 0.07 })); },
  start() { [330, 440, 660].forEach((f, i) => tone({ freq: f, type: 'triangle', dur: 0.11, vol: 0.14, delay: i * 0.055 })); },
  click() { tone({ freq: 620, type: 'square', dur: 0.045, vol: 0.06 }); },
};

/* ================= Game constants & state ================= */
const COLS = 24, ROWS = 24;
const BASE_TICK = 130;      // ms per move at level 1
const MIN_TICK = 58;
const TICK_STEP = 6;        // ms faster per level
const APPLES_PER_LEVEL = 4;

let state = 'idle';         // idle | playing | paused | dying | gameover
let snake = [];
let food = { x: 18, y: 12 };
let dir = { x: 1, y: 0 };
let dirQueue = [];
let score = 0;
let apples = 0;
let level = 1;
let tickMs = BASE_TICK;
let acc = 0;
let lastTime = performance.now();
let playTimeMs = 0;
let shake = 0;
let diedAt = 0;
let lastRecord = false;
let particles = [];
let floats = [];

/* ================= Canvas ================= */
const canvas = document.getElementById('game');
const g = canvas.getContext('2d');
const boardWrap = document.getElementById('boardWrap');
const view = { w: 0, h: 0, cell: 0 };

function resize() {
  const size = boardWrap.clientWidth;
  if (size <= 0) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(size * dpr);
  canvas.height = Math.round(size * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  view.w = size; view.h = size; view.cell = size / COLS;
}
new ResizeObserver(resize).observe(boardWrap);
resize();

/* ================= Helpers ================= */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);

function hexRgb(hex) {
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}
const HEAD_COL = hexRgb('#b6f545');
const TAIL_COL = hexRgb('#2563eb');
const DEAD_COL = [75, 85, 99];
function bodyColor(i, n, dead) {
  const t = n <= 1 ? 0 : i / (n - 1);
  const c = [0, 1, 2].map(k => Math.round(HEAD_COL[k] + (TAIL_COL[k] - HEAD_COL[k]) * t));
  if (dead) return [0, 1, 2].map(k => Math.round(c[k] + (DEAD_COL[k] - c[k]) * 0.75));
  return c;
}
const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

function fmtTime(ms) {
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  if (h) return `${h}h ${m}m`;
  if (m) return `${m}m ${ss}s`;
  return `${ss}s`;
}

/* ================= DOM refs ================= */
const $ = id => document.getElementById(id);
const overlay = $('overlay');
const elScore = $('hudScore'), elBest = $('hudBest'), elLevel = $('hudLevel');
const elStatBest = $('statBest'), elStatGames = $('statGames'), elStatApples = $('statApples');
const elStatLongest = $('statLongest'), elStatTime = $('statTime');
const btnMute = $('btnMute'), btnPause = $('btnPause');

function updateHUD() {
  elScore.textContent = score;
  elBest.textContent = stats.highScore;
  elLevel.textContent = level;
}
function updateStatsDOM() {
  elStatBest.textContent = stats.highScore;
  elStatGames.textContent = stats.gamesPlayed;
  elStatApples.textContent = stats.totalApples;
  elStatLongest.textContent = stats.longestSnake;
  elStatTime.textContent = fmtTime(stats.totalPlayTimeMs);
}

/* ================= Overlays ================= */
function showOverlay(html) {
  overlay.innerHTML = html;
  overlay.classList.remove('hidden');
}
function hideOverlay() { overlay.classList.add('hidden'); }

function overlayIdle() {
  showOverlay(`
    <div class="ov-emoji">🐍</div>
    <h1 class="ov-title">Snake</h1>
    <p class="ov-sub">Eat the apples. Walls wrap around —<br>just don't bite yourself.</p>
    <button class="btn">Start Game</button>
    <p class="ov-hint">press <kbd>Space</kbd> or tap to start</p>
  `);
}
function overlayPaused() {
  showOverlay(`
    <div class="ov-emoji">⏸</div>
    <h1 class="ov-title">Paused</h1>
    <button class="btn">Resume</button>
    <p class="ov-hint">press <kbd>Space</kbd> to resume</p>
  `);
}
function overlayGameOver(win) {
  const lines = [
    `${apples} apple${apples === 1 ? '' : 's'}`,
    `${snake.length} length`,
    `${fmtTime(playTimeMs)} played`,
  ].join(' · ');
  showOverlay(`
    <div class="ov-emoji">${win ? '🏆' : '💀'}</div>
    <h1 class="ov-title ${win ? '' : 'danger'}">${win ? 'Perfect!' : 'Game Over'}</h1>
    <div class="ov-score">${score}</div>
    <p class="ov-sub">${lines}</p>
    ${lastRecord && score > 0 ? '<div class="badge">🏆 New best score!</div>' : ''}
    <button class="btn">Play Again</button>
    <p class="ov-hint">press <kbd>Space</kbd> to play again</p>
  `);
}

/* ================= Game flow ================= */
function spawnFood() {
  const free = [];
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++)
      if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
  if (!free.length) return false;
  food = free[(Math.random() * free.length) | 0];
  return true;
}

function startGame() {
  const cx = (COLS / 2) | 0, cy = (ROWS / 2) | 0;
  snake = [
    { x: cx, y: cy, px: cx, py: cy },
    { x: cx - 1, y: cy, px: cx - 1, py: cy },
    { x: cx - 2, y: cy, px: cx - 2, py: cy },
  ];
  dir = { x: 1, y: 0 };
  dirQueue = [];
  score = 0; apples = 0; level = 1;
  tickMs = BASE_TICK;
  acc = 0; playTimeMs = 0;
  particles = []; floats = []; shake = 0;
  spawnFood();
  state = 'playing';
  hideOverlay();
  updateHUD();
  sfx.start();
}

function die() {
  if (state !== 'playing') return;
  state = 'dying';
  diedAt = performance.now();
  shake = 13;
  sfx.die();
  const head = snake[0];
  for (let i = 0; i < Math.min(snake.length, 14); i++) {
    const s = snake[i];
    spawnBurst((s.x + 0.5) * view.cell, (s.y + 0.5) * view.cell,
      i === 0 ? ['#f87171', '#fca5a5', '#fde047'] : ['#4b5563', '#6b7280'], i === 0 ? 14 : 5, 0.5);
  }
  // ---- persistent stats ----
  stats.gamesPlayed++;
  stats.totalApples += apples;
  stats.longestSnake = Math.max(stats.longestSnake, snake.length);
  stats.totalPlayTimeMs += playTimeMs;
  lastRecord = score > stats.highScore;
  if (lastRecord) stats.highScore = score;
  stats.lastPlayedAt = Date.now();
  saveStats();
  updateStatsDOM();
  updateHUD();
}

function finishGame(win) {
  state = 'gameover';
  overlayGameOver(win);
}

function winGame() {
  if (state !== 'playing') return;
  state = 'dying';
  diedAt = performance.now();
  spawnBurst(view.w / 2, view.h / 2, ['#fde047', '#a3e635', '#34d399', '#60a5fa'], 40, 1);
  stats.gamesPlayed++;
  stats.totalApples += apples;
  stats.longestSnake = Math.max(stats.longestSnake, snake.length);
  stats.totalPlayTimeMs += playTimeMs;
  lastRecord = score > stats.highScore;
  if (lastRecord) stats.highScore = score;
  saveStats();
  updateStatsDOM();
  updateHUD();
}

function togglePause() {
  if (state === 'playing') {
    state = 'paused';
    overlayPaused();
    sfx.click();
  } else if (state === 'paused') {
    state = 'playing';
    hideOverlay();
    sfx.click();
  }
}

/* ================= Core step ================= */
function step() {
  if (dirQueue.length) {
    const d = dirQueue.shift();
    if (!(d.x === -dir.x && d.y === -dir.y)) dir = d;
  }
  const head = snake[0];
  let nx = head.x + dir.x;
  let ny = head.y + dir.y;

  // wrap through walls to the opposite side
  if (nx < 0) nx = COLS - 1;
  else if (nx >= COLS) nx = 0;
  if (ny < 0) ny = ROWS - 1;
  else if (ny >= ROWS) ny = 0;

  const willEat = nx === food.x && ny === food.y;
  const limit = willEat ? snake.length : snake.length - 1;
  for (let i = 0; i < limit; i++) {
    if (snake[i].x === nx && snake[i].y === ny) return die();
  }

  for (const s of snake) { s.px = s.x; s.py = s.y; }
  snake.unshift({ x: nx, y: ny, px: head.x, py: head.y });

  if (willEat) onEat(nx, ny);
  else snake.pop();
}

function onEat(x, y) {
  apples++;
  const pts = 10 + (level - 1) * 2;
  score += pts;

  // live high score
  if (score > stats.highScore) {
    stats.highScore = score;
    saveStats();
    updateStatsDOM();
  }

  // level / speed up
  const newLevel = Math.floor(apples / APPLES_PER_LEVEL) + 1;
  if (newLevel > level) {
    level = newLevel;
    tickMs = Math.max(MIN_TICK, BASE_TICK - (level - 1) * TICK_STEP);
    sfx.level();
    addFloat(x + 0.5, y - 0.4, `LEVEL ${level} ⚡`, '#60a5fa', 1.15);
  } else {
    sfx.eat();
  }
  addFloat(x + 0.5, y + 0.1, `+${pts}`, '#fde047', 1);
  spawnBurst((x + 0.5) * view.cell, (y + 0.5) * view.cell,
    ['#f87171', '#fca5a5', '#fde047', '#a3e635'], 14, 0.55);

  if (!spawnFood()) { winGame(); return; }
  updateHUD();
}

/* ================= Particles & floats ================= */
function spawnBurst(x, y, colors, count, speed) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = rand(0.6, 3.2) * speed * (view.cell / 24);
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 0.6 * speed,
      life: rand(420, 850),
      age: 0,
      size: rand(2, 5),
      color: colors[(Math.random() * colors.length) | 0],
    });
  }
  if (particles.length > 400) particles.splice(0, particles.length - 400);
}
function updateParticles(dt) {
  const k = dt / 1000;
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.age += dt;
    if (p.age >= p.life) { particles.splice(i, 1); continue; }
    p.x += p.vx * k * 60;
    p.y += p.vy * k * 60;
    p.vy += 0.00035 * dt * 60;
    p.vx *= 0.985;
  }
}
function addFloat(x, y, text, color, scale = 1) {
  floats.push({ x: x * view.cell, y: y * view.cell, text, color, age: 0, life: 950, scale });
}

/* ================= Rendering ================= */
function draw(t) {
  const { w, h, cell } = view;
  if (!w) return;

  g.save();
  if (shake > 0.2) g.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  // background
  const bg = g.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, '#0d1526');
  bg.addColorStop(1, '#070b14');
  g.fillStyle = bg;
  g.fillRect(-20, -20, w + 40, h + 40);

  // checkerboard
  g.fillStyle = 'rgba(255,255,255,0.02)';
  for (let y = 0; y < ROWS; y++)
    for (let x = (y % 2); x < COLS; x += 2)
      g.fillRect(x * cell, y * cell, cell, cell);

  const dead = state === 'dying' || state === 'gameover';
  const f = state === 'playing' ? clamp(acc / tickMs, 0, 1) : (dead ? 1 : 0);

  drawFood(t);
  drawSnake(t, f, dead);

  // particles
  for (const p of particles) {
    const a = 1 - p.age / p.life;
    g.globalAlpha = a;
    g.fillStyle = p.color;
    g.beginPath();
    g.arc(p.x, p.y, p.size * a + 0.5, 0, Math.PI * 2);
    g.fill();
  }
  g.globalAlpha = 1;

  // floating score text
  for (const fl of floats) {
    const k = fl.age / fl.life;
    const a = k < 0.2 ? k / 0.2 : 1 - (k - 0.2) / 0.8;
    g.globalAlpha = clamp(a, 0, 1);
    g.fillStyle = fl.color;
    g.font = `800 ${Math.round(cell * 0.42 * fl.scale)}px -apple-system, "Segoe UI", Roboto, sans-serif`;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.shadowColor = 'rgba(0,0,0,0.6)';
    g.shadowBlur = 6;
    g.fillText(fl.text, fl.x, fl.y - k * cell * 1.4);
    g.shadowBlur = 0;
  }
  g.globalAlpha = 1;

  g.restore();

  // vignette
  const v = g.createRadialGradient(w / 2, h / 2, w * 0.35, w / 2, h / 2, w * 0.78);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.42)');
  g.fillStyle = v;
  g.fillRect(0, 0, w, h);
}

function drawFood(t) {
  const { cell } = view;
  if (state === 'idle' || state === 'gameover') return;
  const fx = food.x * cell + cell / 2;
  const fy = food.y * cell + cell / 2;
  const pulse = 1 + 0.07 * Math.sin(t / 190);
  const r = cell * 0.33 * pulse;

  // glow halo
  g.save();
  g.shadowColor = 'rgba(248, 113, 113, 0.9)';
  g.shadowBlur = cell * 0.65;

  const grad = g.createRadialGradient(fx - r * 0.35, fy - r * 0.4, r * 0.15, fx, fy, r);
  grad.addColorStop(0, '#fecaca');
  grad.addColorStop(0.45, '#ef4444');
  grad.addColorStop(1, '#991b1b');
  g.fillStyle = grad;
  g.beginPath();
  g.arc(fx, fy, r, 0, Math.PI * 2);
  g.fill();
  g.restore();

  // stem
  g.strokeStyle = '#a16207';
  g.lineWidth = Math.max(1.5, cell * 0.055);
  g.lineCap = 'round';
  g.beginPath();
  g.moveTo(fx, fy - r * 0.9);
  g.quadraticCurveTo(fx + cell * 0.05, fy - r - cell * 0.08, fx + cell * 0.1, fy - r - cell * 0.14);
  g.stroke();

  // leaf
  g.fillStyle = '#4ade80';
  g.beginPath();
  g.ellipse(fx + cell * 0.16, fy - r - cell * 0.06, cell * 0.11, cell * 0.055, -0.6, 0, Math.PI * 2);
  g.fill();
}

function drawSnake(t, f, dead) {
  const { cell } = view;
  const n = snake.length;
  if (!n) return;

  const pts = new Array(n);
  for (let i = 0; i < n; i++) {
    const s = snake[i];
    const px = (s.px == null ? s.x : s.px);
    const py = (s.py == null ? s.y : s.py);
    pts[i] = {
      x: mod(lerpWrap(px, s.x, f, COLS), COLS) * cell + cell / 2,
      y: mod(lerpWrap(py, s.y, f, ROWS), ROWS) * cell + cell / 2,
    };
  }

  // body: gradient segments, tapered toward tail
  g.lineCap = 'round';
  g.lineJoin = 'round';
  for (let i = n - 1; i > 0; i--) {
    const taper = 0.52 + 0.48 * (1 - i / Math.max(1, n - 1));
    const c = rgb(bodyColor(i, n, dead));
    const dx = pts[i].x - pts[i - 1].x, dy = pts[i].y - pts[i - 1].y;
    if (Math.hypot(dx, dy) > cell * 1.5) {
      // this segment crosses a wall wrap: cap both ends with circles so the
      // body doesn't streak across the board
      g.fillStyle = c;
      g.beginPath(); g.arc(pts[i].x, pts[i].y, cell * 0.37 * taper, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.arc(pts[i - 1].x, pts[i - 1].y, cell * 0.37 * taper, 0, Math.PI * 2); g.fill();
    } else {
      g.strokeStyle = c;
      g.lineWidth = cell * 0.74 * taper;
      g.beginPath();
      g.moveTo(pts[i].x, pts[i].y);
      g.lineTo(pts[i - 1].x, pts[i - 1].y);
      g.stroke();
    }
  }

  // head
  const hp = pts[0];
  const dirVec = n > 1
    ? norm(hp.x - pts[1].x, hp.y - pts[1].y)
    : { x: dir.x, y: dir.y };
  const R = cell * 0.42;

  g.save();
  if (!dead) {
    g.shadowColor = 'rgba(182, 245, 69, 0.85)';
    g.shadowBlur = cell * 0.55;
  }
  g.fillStyle = rgb(bodyColor(0, n, dead));
  g.beginPath();
  g.arc(hp.x, hp.y, R, 0, Math.PI * 2);
  g.fill();
  g.restore();

  // eyes
  const px_ = -dirVec.y, py_ = dirVec.x; // perpendicular
  const eyeOff = cell * 0.17, eyeR = cell * 0.105, pupR = cell * 0.055;
  for (const side of [-1, 1]) {
    const ex = hp.x + dirVec.x * cell * 0.14 + px_ * eyeOff * side;
    const ey = hp.y + dirVec.y * cell * 0.14 + py_ * eyeOff * side;
    if (dead) {
      // X eyes
      g.strokeStyle = '#111827';
      g.lineWidth = Math.max(1.5, cell * 0.05);
      g.lineCap = 'round';
      const d = eyeR * 0.55;
      g.beginPath();
      g.moveTo(ex - d, ey - d); g.lineTo(ex + d, ey + d);
      g.moveTo(ex + d, ey - d); g.lineTo(ex - d, ey + d);
      g.stroke();
    } else {
      g.fillStyle = '#ffffff';
      g.beginPath(); g.arc(ex, ey, eyeR, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#0f172a';
      g.beginPath();
      g.arc(ex + dirVec.x * eyeR * 0.4, ey + dirVec.y * eyeR * 0.4, pupR, 0, Math.PI * 2);
      g.fill();
    }
  }

  // tongue flick
  if (!dead && Math.sin(t / 130) > 0.15) {
    const tx = hp.x + dirVec.x * R * 1.05;
    const ty = hp.y + dirVec.y * R * 1.05;
    const len = cell * 0.22 * (0.7 + 0.3 * Math.sin(t / 90));
    g.strokeStyle = '#f43f5e';
    g.lineWidth = Math.max(1.5, cell * 0.05);
    g.lineCap = 'round';
    g.beginPath();
    g.moveTo(tx, ty);
    g.lineTo(tx + dirVec.x * len, ty + dirVec.y * len);
    const tipX = tx + dirVec.x * len, tipY = ty + dirVec.y * len;
    g.moveTo(tipX, tipY);
    g.lineTo(tipX + (dirVec.x + px_ * 0.7) * cell * 0.08, tipY + (dirVec.y + py_ * 0.7) * cell * 0.08);
    g.moveTo(tipX, tipY);
    g.lineTo(tipX + (dirVec.x - px_ * 0.7) * cell * 0.08, tipY + (dirVec.y - py_ * 0.7) * cell * 0.08);
    g.stroke();
  }
}
function norm(x, y) {
  const m = Math.hypot(x, y);
  return m > 0 ? { x: x / m, y: y / m } : { x: 1, y: 0 };
}
function mod(v, m) { return ((v % m) + m) % m; }
function lerpWrap(a, b, f, size) {
  let d = b - a;
  if (d > size / 2) d -= size;
  if (d < -size / 2) d += size;
  return a + d * f;
}

/* ================= Main loop ================= */
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(100, t - lastTime);
  lastTime = t;

  if (state === 'playing') {
    acc += dt;
    playTimeMs += dt;
    while (acc >= tickMs) {
      acc -= tickMs;
      step();
      if (state !== 'playing') break;
    }
  } else if (state === 'dying') {
    if (t - diedAt > 850) finishGame(false);
  }

  updateParticles(dt);
  for (let i = floats.length - 1; i >= 0; i--) {
    floats[i].age += dt;
    if (floats[i].age >= floats[i].life) floats.splice(i, 1);
  }
  shake *= Math.pow(0.94, dt / 16.7);
  if (shake < 0.2) shake = 0;

  draw(t);
}
requestAnimationFrame(frame);

/* ================= Input ================= */
const KEY_DIRS = {
  ArrowUp: [0, -1], KeyW: [0, -1],
  ArrowDown: [0, 1], KeyS: [0, 1],
  ArrowLeft: [-1, 0], KeyA: [-1, 0],
  ArrowRight: [1, 0], KeyD: [1, 0],
};

function pushDir(x, y) {
  if (state === 'dying' || state === 'gameover') return;
  if (state === 'idle') { startGame(); }
  const last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
  if (x === -last.x && y === -last.y) return; // no reversal
  if (x === last.x && y === last.y) return;    // same direction
  if (dirQueue.length < 3) dirQueue.push({ x, y });
}

window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'Space') {
    e.preventDefault();
    if (state === 'idle' || state === 'gameover') startGame();
    else togglePause();
    return;
  }
  if (e.code === 'Enter' && (state === 'idle' || state === 'gameover')) { startGame(); return; }
  if (e.code === 'KeyM') { toggleMute(); return; }
  const k = KEY_DIRS[e.code];
  if (k) { e.preventDefault(); pushDir(k[0], k[1]); }
});

// overlay tap
overlay.addEventListener('click', () => {
  if (state === 'idle' || state === 'gameover') startGame();
  else if (state === 'paused') togglePause();
});

// swipe controls
let touchStart = null;
canvas.addEventListener('touchstart', e => {
  const t = e.touches[0];
  touchStart = { x: t.clientX, y: t.clientY };
}, { passive: true });
canvas.addEventListener('touchend', e => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x;
  const dy = t.clientY - touchStart.y;
  touchStart = null;
  if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return; // tap
  if (Math.abs(dx) > Math.abs(dy)) pushDir(Math.sign(dx), 0);
  else pushDir(0, Math.sign(dy));
}, { passive: true });

// d-pad
document.querySelectorAll('#dpad button').forEach(b => {
  b.addEventListener('pointerdown', e => {
    e.preventDefault();
    pushDir(+b.dataset.dx, +b.dataset.dy);
  });
});

// buttons
btnMute.addEventListener('click', e => { e.stopPropagation(); toggleMute(); });
btnPause.addEventListener('click', e => {
  e.stopPropagation();
  if (state === 'idle' || state === 'gameover') startGame();
  else togglePause();
});

function toggleMute() {
  muted = !muted;
  try { localStorage.setItem(MUTE_KEY, muted ? '1' : '0'); } catch (e) {}
  btnMute.textContent = muted ? '🔇' : '🔊';
  if (!muted) sfx.click();
}
btnMute.textContent = muted ? '🔇' : '🔊';

$('btnReset').addEventListener('click', e => {
  e.stopPropagation();
  if (!confirm('Reset all saved statistics?')) return;
  stats = defaultStats();
  saveStats();
  updateStatsDOM();
  updateHUD();
  sfx.click();
});

// auto-pause when tab hidden
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'playing') togglePause();
});

// flush play time on close
window.addEventListener('beforeunload', () => {
  if (state === 'playing' || state === 'paused') {
    stats.totalPlayTimeMs += playTimeMs;
    saveStats();
  }
});

/* ================= Init ================= */
updateStatsDOM();
updateHUD();
overlayIdle();
})();
</script>
</body>
</html>
